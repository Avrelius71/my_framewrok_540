name: Python Autotests

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Копируем тесты
      uses: actions/checkout@v4

    - name: Устанавливаю Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Ставим зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Гоняем тесты
      run: |
        pytest --junitxml=report.xml --html=report.html --self-contained-html

    - name: Сохраняем отчёты
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          report.xml
          report.html
        retention-days: 14