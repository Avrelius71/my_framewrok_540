name: Start test
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  start_test:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Копируем тесты
      uses: actions/checkout@v4

    - name: Устанавливаю Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Ставим зависимости
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Ставим Allure CLI
      run: |
        ALLURE_VERSION=2.32.0
        curl -Lo /tmp/allure.tgz "https://github.com/allure-framework/allure2/releases/download/${ALLURE_VERSION}/allure-${ALLURE_VERSION}.tgz"
        sudo tar -xzf /tmp/allure.tgz -C /opt/
        echo "/opt/allure-${ALLURE_VERSION}/bin" >> "$GITHUB_PATH"

    - name: Гоняем тесты
      run: |
        pytest --alluredir=./allure-results

    - name: Генерим отчёт
      if: always()
      run: |
        allure generate ./allure-results --clean -o ./allure-report

    - name: Отчет (артефакт)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-report
        path: allure-report/
        retention-days: 14

    - name: Публикуем на GitHub Pages
      if: always() && github.ref == 'refs/heads/main'
      uses: peaceiris/actions-gh-pages@v4
      with:
        github_token: ${{ secrets.GITHUB_TOKEN }}
        publish_dir: ./allure-report
        publish_branch: gh-pages